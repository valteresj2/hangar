# Windows installer for Hangar. Build with `npm run dist` (NSIS, x64) or `npm run pack` (unpacked dir).
appId: dev.hangar.app # must match app.setAppUserModelId in src/main/index.ts (notifications)
productName: Hangar
copyright: Copyright © 2026 Valter Eduardo

directories:
  output: release
  buildResources: build

# electron-vite bundles main/preload/renderer into out/. Production node_modules are added by electron-builder;
# packages that only the renderer uses are already bundled, so they are left out.
files:
  - out/**
  - package.json
  - '!**/*.{map,pdb}'
  - '!node_modules/{react,react-dom,scheduler,react-markdown,remark-gfm,shiki,@shikijs,@xterm,diff,zustand}/**'
  # node-pty: keep only the Windows x64 runtime (no sources, build scripts or other platforms' binaries).
  - '!node_modules/node-addon-api/**'
  - '!node_modules/node-pty/{src,deps,scripts,typings,binding.gyp,build}{,/**}'
  - '!node_modules/node-pty/prebuilds/{darwin-arm64,darwin-x64,win32-arm64}/**'
  - '!node_modules/node-pty/third_party/conpty/*/win10-arm64/**'

# Native/executable bits must live on disk, not inside app.asar:
#  - node-pty: pty.node / conpty.node / conpty_console_list.node, conpty.dll, OpenConsole.exe, winpty-agent.exe and the
#    forked console-list helper script.
#  - Agent SDK: the platform package ships the native `claude.exe` the SDK spawns when no CLI is found.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**

# node-pty uses N-API prebuilds; rebuilding is unnecessary and fails on this machine (see docs/agents/reports/terminal.md).
npmRebuild: false

# Electron fuses, flipped after packaging and before signing (https://www.electron.build/docs/tutorials/adding-electron-fuses).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: false
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true

# Auto-update feed, embedded in the app as resources/app-update.yml. It must be PUBLIC: the app cannot carry a token.
# The source repo (valteresj2/hangar) is private, so releases go to a separate public repo. CI can override the target
# (see .github/workflows/release.yml and docs/RELEASE.md).
publish:
  provider: github
  owner: valteresj2
  repo: hangar-releases
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  signAndEditExecutable: true
  # Code signing is optional and driven by the environment, so local builds keep working unsigned:
  #  - .pfx certificate: set CSC_LINK (path/URL/base64) and CSC_KEY_PASSWORD (or WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD).
  #  - Azure Trusted Signing: CI passes win.azureSignOptions.* on the command line plus AZURE_TENANT_ID,
  #    AZURE_CLIENT_ID and AZURE_CLIENT_SECRET (see docs/RELEASE.md). Not set here because its presence forces signing.
  # Without either, electron-builder skips signing and SmartScreen / Smart App Control will warn or block.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Hangar
  uninstallDisplayName: Hangar
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
