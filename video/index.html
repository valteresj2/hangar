<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Hangar Desktop — vídeo</title>
    <!--
      The product video, as a page: every element is positioned by window.renderAt(t) (scenes.js), deterministically,
      so render.cjs can capture it frame by frame. Open it in a browser to preview (it plays itself with ?play).
    -->
    <style>
      @font-face {
        font-family: 'Barlow Semi Condensed';
        font-weight: 700;
        src: url('../node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-700-normal.woff2');
      }
      @font-face {
        font-family: 'Barlow Semi Condensed';
        font-weight: 600;
        src: url('../node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-600-normal.woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 400;
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 600;
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2');
      }
      :root {
        --navy: #0f1726;
        --navy-2: #151f31;
        --tarmac: #1c2530;
        --line: #26313e;
        --mark: #f4b400;
        --mark-soft: rgba(244, 180, 0, 0.18);
        --ink: #f3f5f7;
        --mute: #8f9bab;
        --title: 'Segoe UI Variable Display', 'Segoe UI', 'Inter', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
        color: var(--ink);
        font-family: var(--title);
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(1200px 700px at 50% 45%, #18233a 0%, var(--navy) 60%, #0a101b 100%);
      }
      /* A faint blueprint grid behind everything. */
      #grid {
        position: absolute;
        inset: -40px;
        background-image:
          linear-gradient(rgba(143, 155, 171, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(143, 155, 171, 0.06) 1px, transparent 1px);
        background-size: 64px 64px;
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        will-change: opacity, transform;
      }
      .abs {
        position: absolute;
        will-change: transform, opacity;
      }
      .title {
        font-weight: 700;
        font-size: 84px;
        line-height: 1.05;
        letter-spacing: -0.015em;
        white-space: nowrap;
      }
      /* Titles stay above the screenshots that zoom in under them. */
      .abs:has(> .title) {
        z-index: 5;
      }
      .title em {
        font-style: normal;
        color: var(--mark);
      }
      .sub {
        font-size: 34px;
        color: var(--mute);
        font-weight: 500;
      }
      .wordmark {
        font-family: 'Barlow Semi Condensed', sans-serif;
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      .wordmark b {
        font-weight: 700;
        font-size: 120px;
        letter-spacing: 0.005em;
      }
      .wordmark span {
        font-weight: 600;
        font-size: 44px;
        letter-spacing: 0.22em;
        color: var(--mark);
      }
      .glow {
        filter: drop-shadow(0 0 18px rgba(244, 180, 0, 0.55)) drop-shadow(0 0 48px rgba(244, 180, 0, 0.25));
      }
      /* Floating "tool" cards of the opening. */
      .card {
        width: 300px;
        height: 170px;
        border-radius: 22px;
        padding: 22px;
        background: rgba(38, 49, 62, 0.72);
        border: 1px solid rgba(143, 155, 171, 0.22);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      .card .dot {
        width: 34px;
        height: 34px;
        border-radius: 50%;
      }
      .card .bar {
        height: 14px;
        border-radius: 7px;
        margin-top: 16px;
        background: rgba(243, 245, 247, 0.16);
      }
      .card .label {
        position: absolute;
        right: 22px;
        top: 26px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 18px;
        color: var(--mute);
      }
      /* App window frame around the screenshots. */
      .window {
        border-radius: 18px;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 40px 120px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .window img {
        display: block;
        width: 100%;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 16px 28px;
        border-radius: 999px;
        border: 3px solid var(--mark);
        background: rgba(15, 23, 38, 0.86);
        font-size: 34px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0 0 30px rgba(244, 180, 0, 0.18);
      }
      .chip i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--mark);
        display: inline-block;
      }
      .pill {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 999px;
        background: rgba(244, 180, 0, 0.14);
        color: var(--mark);
        font-size: 28px;
        font-weight: 600;
        white-space: nowrap;
      }
      .ring {
        border: 4px solid var(--mark);
        border-radius: 16px;
        box-shadow: 0 0 40px rgba(244, 180, 0, 0.45);
      }
      .mono {
        font-family: 'IBM Plex Mono', Consolas, monospace;
      }
      /* Installer mock-up. */
      .installer {
        width: 1100px;
        height: 640px;
        border-radius: 14px;
        overflow: hidden;
        background: #f3f4f6;
        color: #17212c;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
        font-family: 'Segoe UI', sans-serif;
      }
      .installer .bar-title {
        height: 52px;
        background: #fff;
        border-bottom: 1px solid #dfe3e8;
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 12px;
        font-size: 20px;
      }
      .installer .body {
        display: flex;
        height: calc(100% - 52px);
      }
      .installer .side {
        width: 328px;
        background: #1c2530 center / cover no-repeat;
      }
      .installer .main {
        flex: 1;
        padding: 56px 60px;
      }
      .installer h3 {
        margin: 0 0 14px;
        font-size: 36px;
        font-weight: 600;
      }
      .installer p {
        margin: 0;
        font-size: 22px;
        color: #56616e;
      }
      .installer .track {
        margin-top: 46px;
        height: 18px;
        border-radius: 9px;
        background: #dfe3e8;
        overflow: hidden;
      }
      .installer .fill {
        height: 100%;
        width: 0;
        background: var(--mark);
      }
      .installer .file {
        margin-top: 18px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 18px;
        color: #56616e;
      }
      /* Chat recreated in the app's style (agent creation). */
      .chat {
        width: 1180px;
        border-radius: 22px;
        background: #f5f6f8;
        color: #17212c;
        padding: 46px 56px 56px;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
      }
      .bubble {
        margin-left: auto;
        max-width: 860px;
        padding: 20px 28px;
        border-radius: 16px;
        background: #e8edf6;
        border: 1px solid #d5dce8;
        font-size: 30px;
        line-height: 1.35;
      }
      .tool {
        margin-top: 22px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px 26px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid #dfe3e8;
        font-size: 26px;
      }
      .tool .ok {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #1f9d55;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 700;
      }
      .tool .name {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 500;
        color: #17212c;
      }
      .tool .what {
        color: #56616e;
      }
      .agent-card {
        width: 760px;
        padding: 30px 36px;
        border-radius: 20px;
        background: #fff;
        color: #17212c;
        border: 3px solid var(--mark);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.45),
          0 0 60px rgba(244, 180, 0, 0.35);
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
      }
      .agent-card .head {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 36px;
        font-weight: 600;
      }
      .agent-card .avatar {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #fff4cf;
        color: #8a5a00;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 28px;
      }
      .agent-card .tags {
        margin-top: 20px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .agent-card .tags span {
        padding: 8px 18px;
        border-radius: 999px;
        border: 1px solid #dfe3e8;
        font-size: 22px;
        color: #3c4652;
      }
      .agent-card .tags .live {
        background: #e7f6ec;
        border-color: #bfe5cc;
        color: #1f7a44;
      }
      .footnote {
        font-size: 20px;
        color: #6b7686;
      }
      .crop {
        overflow: hidden;
      }
      .crop img {
        position: absolute;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="grid"></div>
    </div>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <!-- The Agent Hangar mark (src/renderer/src/shell/Brand.tsx, large variant). -->
        <path id="mark-path" d="M232 760 V462 L512 300 L792 462 V760 H694 V530 H330 V760 Z" />
      </defs>
    </svg>
    <script src="scenes.js"></script>
  </body>
</html>
